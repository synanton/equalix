spring:
  datasource:
    url: jdbc:tc:postgresql:16:///equalix
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    listener:
      ack-mode: manual_immediate
      auto-startup: false
    consumer:
      group-id: equalix-ingestion
      auto-offset-reset: earliest
      enable-auto-commit: false

app:
  scheduling:
    enabled: false
  security:
    api-key: test-api-key
  executor:
    base-url: http://localhost:9999
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
  kafka:
    topics:
      ingestion: equalix-tasks-test
  queue:
    max-tasks-in-process: 100
    max-per-client-quota: 10
    priority-calc-interval: 100
    dispatcher-interval: 50
    worker-poll-size: 10
    max-queued-time-ms: 60000
    task-timeout-ms: 300000
    max-payload-bytes: 1048576
    # flat: every fairness key is an independent tenant. hierarchical: keys are paths (org/department/...)
    # and every layer is scheduled fairly among its siblings, see app.hierarchical (EQX-7).
    fairness-mode: flat
    virtual-time:
      # Virtual-time units charged per task at weight 1.0 (a task advances its key by quantum / weight).
      # Comparable to the in-flight pressure term, which adds 1000 / currentRps per in-flight task.
      quantum: 1000
    aging:
      # Anti-starvation aging A(W), subtracted from priority at dispatch time (W = seconds since creation).
      # none | linear (lambda*W) | log (lambda*ln(1+W)) | power (lambda*W^gamma).
      # max-queued-time-ms promotion stays active as a hard backstop for every policy.
      policy: none
      # Aging rate in priority units; one weight-1 task is worth virtual-time.quantum units.
      lambda: 1000
      # Exponent for the power policy; > 1 spares short waits and promotes long waits aggressively.
      gamma: 2.0
      # Rows locked from each candidate ordering (best priority, oldest) before re-ranking by aged priority.
      candidate-pool-size: 200
    cms:
      mode: local
      width: 1024
      depth: 3
      error-sampling:
        # Periodically sample e_k = CMS estimate - in-flight tasks and publish equalix.cms.estimation.error*
        # (EQX-2). Meant for load tests: each sample runs a GROUP BY over in-flight tasks.
        enabled: false
        interval-ms: 1000
    sequential:
      enabled: true
      client-block-timeout-ms: 10000
      dispatcher-interval: 50
      block-recovery-interval: 1000
      result-passthrough-interval: 1000
  adaptive-rps:
    enabled: false
    initial-rps: 10
    min-rps: 1
    max-rps: 100
    target-latency-ms: 200
    error-threshold: 0.05
    latency-threshold: 0.2
    window-size: 100
    min-samples: 10
    emergency-factor: 0.5
    decrease-factor: 0.9
    increase-factor: 1.05
    increase-error-threshold: 0.01
    adjustment-interval-ms: 2000
    latency-ema-alpha: 0.7
    direction-change-confirmations: 3
  hierarchical:
    # Used when app.queue.fairness-mode is hierarchical.
    separator: /
    # Layers from the root down. Segments beyond the last layer fold into it; shorter keys are leaves higher up.
    layers:
      - name: organization
        default-weight: 1.0
      - name: department
        default-weight: 1.0
    # Per-node weight overrides by path, e.g. "[acme]": 2.0 or "[acme/sales]": 3.0. Leaves otherwise use the
    # task weight; other nodes use their layer's default-weight.
    weights: {}
    # Layers (from the root) whose nodes get an equalix.hierarchy.dispatches{layer,node} counter.
    metrics-depth: 1
  watchdog:
    interval-minutes: 60
    # Keys exported as equalix.cms.estimation.drift{fairnessKey} per run (largest |drift| first).
    drift-metric-max-keys: 100

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
